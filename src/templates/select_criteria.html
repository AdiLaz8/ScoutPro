<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>Player Filters | ScoutPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">
    <div class="card mx-auto p-4" style="max-width: 520px;">
        <h3 class="mb-4 text-center text-primary">Player Search Filters</h3>
        <form method="post">
            <div class="mb-3">
                <label class="form-label fw-bold">Position</label>
                <select class="form-select" name="position" required>
                    <option value="" disabled {% if not selected_filters.position %}selected{% endif %}>Select position</option>
                    {% for pos in positions %}
                        <option value="{{ pos }}" {% if selected_filters.position == pos %}selected{% endif %}>{{ pos }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="row g-2">
                <div class="col-6">
                    <label class="form-label">Min Age</label>
                    <input type="number" name="min_age" class="form-control" min="15" value="{{ selected_filters.min_age or '' }}">
                </div>
                <div class="col-6">
                    <label class="form-label">Max Age</label>
                    <input type="number" name="max_age" class="form-control" min="15" value="{{ selected_filters.max_age or '' }}">
                </div>
            </div>
            <div class="row g-2 mt-2">
                <div class="col-6">
                    <label class="form-label">Max Market Value (€)</label>
                    <input type="number" name="max_budget" class="form-control" min="0" step="100000" value="{{ selected_filters.max_budget or '' }}">
                </div>
                <div class="col-6">
                    <label class="form-label">Min Height (cm)</label>
                    <input type="number" name="min_height" class="form-control" min="150" value="{{ selected_filters.min_height or '' }}">
                </div>
            </div>
            <div class="mb-2 mt-3">
                <label class="form-label">Nationality</label>
                <select name="nationality" class="form-select">
                    <option value="">All nationalities</option>
                    {% for nat in nationalities %}
                        <option value="{{ nat }}" {% if selected_filters.nationality == nat %}selected{% endif %}>{{ nat }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-2">
                <label class="form-label">Preferred Foot</label>
                <select name="preferred_foot" class="form-select">
                    <option value="">Any</option>
                    <option value="right" {% if selected_filters.preferred_foot == 'right' %}selected{% endif %}>Right</option>
                    <option value="left" {% if selected_filters.preferred_foot == 'left' %}selected{% endif %}>Left</option>
                </select>
            </div>
            <div class="mb-2">
                <label class="form-label">Current Club</label>
                <select name="curr_club" class="form-select">
                    <option value="">All clubs</option>
                    {% for club in clubs %}
                        <option value="{{ club }}" {% if selected_filters.curr_club == club %}selected{% endif %}>{{ club }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-2 row g-2">
                <div class="col-6">
                    <label class="form-label">Min Skill Moves</label>
                    <input type="number" name="skill_moves" class="form-control" min="1" max="5" value="{{ selected_filters.skill_moves or '' }}">
                </div>
                <div class="col-6">
                    <label class="form-label">Min Weak Foot</label>
                    <input type="number" name="weak_foot" class="form-control" min="1" max="5" value="{{ selected_filters.weak_foot or '' }}">
                </div>
            </div>
            <div class="d-grid gap-2 mt-4">
                <button type="submit" class="btn btn-success btn-lg">Show Players</button>
                <a href="{{ url_for('select_team') }}" class="btn btn-outline-secondary btn-lg">← Back to Team Selection</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
