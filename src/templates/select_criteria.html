<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>Player Filters | ScoutPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">
    <div class="card p-4 mx-auto w-100" style="max-width: 960px;">
        <h3 class="mb-4 text-center text-primary">Player Search Filters</h3>
        <form method="post">
            <!-- === POSITION MAP ================================================== -->
            <style>
                .pitch-wrapper { margin-top: .25rem !important;
                    position: relative;
                    width: 100%;
                    max-width: 420px;
                    aspect-ratio: 3 / 4;
                    margin: 0 auto 1rem auto;
                    background: url("{{ url_for('static', filename='img/pitch.png') }}") no-repeat center/contain;
                }
            
                .pos-btn {
                    position: absolute;
                    width: 44px; height: 44px;
                    border-radius: 50%;
                    background: #2e7d32;
                    color: #fff; font-weight: 700;
                    font-size: 0.8rem;
                    border: 2px solid transparent;
                    display: flex; align-items: center; justify-content: center;
                    cursor: pointer; user-select: none;
                    transition: .15s;
                }
                .pos-btn:hover { transform: scale(1.1); }
                .pos-btn.selected { border-color: #ffc107; }
            
                .pos-gk  { bottom: 9%;   left: 50%; transform: translate(-50%, 0); }
                .pos-lb  { bottom: 20%;  left: 16%; }
                .pos-cb  { bottom: 20%;  left: 50%; transform: translate(-50%, 0); }
                .pos-rb  { bottom: 20%;  right: 16%; }
            
                .pos-cm { bottom: 52%;  left: 50%; transform: translate(-50%, 0); }
                .pos-lm  { bottom: 52%;  left: 16%; }
                .pos-cdm  { bottom: 36%;  left: 50%; transform: translate(-50%, 0); }  /* היה CDM */
                .pos-rm  { bottom: 52%;  right: 16%; }
            
                .pos-cam { bottom: 70%;  left: 50%; transform: translate(-50%, 0); }  /* היה CM */
            
                .pos-lw  { top: 10%;     left: 16%; }
                .pos-st  { top: 10%;     left: 50%; transform: translate(-50%, 0); }
                .pos-rw  { top: 10%;     right: 16%; }
            </style>
            

            <div class="text-center mb-2">
                <label class="form-label fw-bold mb-0">Position</label>
            </div>            
            <input type="hidden" id="position_input" name="position" value="{{ selected_filters.position or '' }}">

            <div class="pitch-wrapper">
                {% for code in ['GK','LB','CB','RB','CDM','LM','CM','RM','LW','ST','RW','CAM'] %}
                    <div class="pos-btn pos-{{ code|lower }} {% if selected_filters.position == code %}selected{% endif %}"
                        data-pos="{{ code }}">{{ code }}</div>
                {% endfor %}
            </div>

            <script>
            document.querySelectorAll('.pos-btn').forEach(btn=>{
                btn.addEventListener('click',()=>{
                    document.getElementById('position_input').value = btn.dataset.pos;
                    document.querySelectorAll('.pos-btn').forEach(b=>b.classList.remove('selected'));
                    btn.classList.add('selected');
                });
            });
            </script>
            <!-- === POSITION MAP END ============================================== -->
            <div class="row g-2">
                <div class="col-6">
                    <label class="form-label">Min Age</label>
                    <input type="number" name="min_age" class="form-control" min="15" value="{{ selected_filters.min_age or '' }}">
                </div>
                <div class="col-6">
                    <label class="form-label">Max Age</label>
                    <input type="number" name="max_age" class="form-control" min="15" value="{{ selected_filters.max_age or '' }}">
                </div>
            </div>
            <div class="row g-2 mt-2">
                <div class="col-6">
                    <label class="form-label">Max Market Value (€)</label>
                    <input type="number" name="max_budget" class="form-control" min="0" step="100000" value="{{ selected_filters.max_budget or '' }}">
                </div>
                <div class="col-6">
                    <label class="form-label">Min Height (cm)</label>
                    <input type="number" name="min_height" class="form-control" min="150" value="{{ selected_filters.min_height or '' }}">
                </div>
            </div>
            <div class="mb-2 mt-3">
                <label class="form-label">Nationality</label>
                <select name="nationality" class="form-select">
                    <option value="">All nationalities</option>
                    {% for nat in nationalities %}
                        <option value="{{ nat }}" {% if selected_filters.nationality == nat %}selected{% endif %}>{{ nat }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-2">
                <label class="form-label">Preferred Foot</label>
                <select name="preferred_foot" class="form-select">
                    <option value="">Any</option>
                    <option value="right" {% if selected_filters.preferred_foot == 'right' %}selected{% endif %}>Right</option>
                    <option value="left" {% if selected_filters.preferred_foot == 'left' %}selected{% endif %}>Left</option>
                </select>
            </div>
            <div class="mb-2">
                <label class="form-label">Current Club</label>
                <select name="curr_club" class="form-select">
                    <option value="">All clubs</option>
                    {% for club in clubs %}
                        <option value="{{ club }}" {% if selected_filters.curr_club == club %}selected{% endif %}>{{ club }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-2 row g-2">
                <div class="col-6">
                    <label class="form-label">Min Skill Moves</label>
                    <input type="number" name="skill_moves" class="form-control" min="1" max="5" value="{{ selected_filters.skill_moves or '' }}">
                </div>
                <div class="col-6">
                    <label class="form-label">Min Weak Foot</label>
                    <input type="number" name="weak_foot" class="form-control" min="1" max="5" value="{{ selected_filters.weak_foot or '' }}">
                </div>
            </div>
            <div class="d-grid gap-2 mt-4">
                <button type="submit" class="btn btn-primary btn-lg">Show Players</button>
                <a href="{{ url_for('recommendations_page', team_name=team_name) }}"
                   class="btn btn-success btn-lg">Smart Recommendations</a>
                <a href="{{ url_for('select_team') }}"
                   class="btn btn-outline-secondary btn-lg">← Back to Team Selection</a>
            </div>
            
            
        </form>
    </div>
</div>
</body>
</html>
