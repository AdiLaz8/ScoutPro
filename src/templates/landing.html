<!-- landing.html - Landing page for ScoutPro -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ScoutPro – Welcome</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Main full-height hero background */
        body, html { height: 100%; margin: 0; }
        .hero-bg {
            background: url('/static/scoutpro-hero.png') no-repeat center center;
            background-size: cover;
            height: 100vh;
            min-height: 600px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            position: relative;
        }
        /* Content box on the right side */
        .hero-content {
            background: rgba(0,32,16,0.37);
            border-radius: 28px;
            padding: 56px 52px 48px 30px;
            color: #fff;
            text-align: right;
            max-width: 540px;
            margin-right: 6vw;
            box-shadow: 0 10px 36px #0005;
        }
        /* Start button at the bottom center */
        .start-btn-bottom {
            position: absolute;
            left: 50%;
            bottom: 200px;
            transform: translateX(-50%);
            z-index: 10;
        }
        @media (max-width: 900px) {
            .hero-content { padding: 50px 10px; font-size: 1em; margin-right: 0;}
        }
    </style>
</head>
<body>
    <!-- Main hero section with background image -->
    <div class="hero-bg">
        <div class="hero-content">
        </div>
        <a href="/select_team" class="btn btn-success btn-lg shadow-lg start-btn-bottom">Start Scouting</a>
    </div>
</body>
</html>
