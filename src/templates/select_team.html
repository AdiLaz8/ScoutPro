<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Select Team | ScoutPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.2/svgs/solid/futbol.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        body { background: linear-gradient(135deg, #e0e7ff 0%, #f8fafc 100%); }
        .main-logo {
            width: 60px; position: absolute; top: 18px; left: 36px; filter: drop-shadow(0 4px 8px #0002);
            z-index: 10;
            animation: bounceIn 1s;
        }
        .card { border-radius: 22px; box-shadow: 0 8px 32px #0002; }
        .btn, .form-select { border-radius: 12px !important; }
    </style>
</head>
<body>
    <img class="main-logo animate__animated animate__tada" src="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.2/svgs/solid/futbol.svg" alt="ScoutPro Logo">
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card p-5 animate__animated animate__fadeInDown" style="min-width:340px; max-width:440px;">
            <h2 class="mb-4 text-center text-primary animate__fadeInDown">ScoutPro Football Analytics</h2>
            <form method="post" id="teamForm">
                <div class="mb-3">
                    <label for="team_name" class="form-label fw-bold">Choose Team</label>
                    <select name="team_name" id="team_name" class="form-select" required>
                        <option value="" disabled selected>Select...</option>
                        {% for team in teams %}
                            <option value="{{ team }}">{{ team }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="d-grid gap-3 mt-4">
                    <button type="submit" name="action" value="filters" class="btn btn-primary btn-lg" id="toFiltersBtn">Player Search (Filters)</button>
                    <button type="button" class="btn btn-success btn-lg" id="toRecsBtn">Smart Recommendations</button>
                </div>
            </form>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const toRecsBtn = document.getElementById('toRecsBtn');
            const teamSelect = document.getElementById('team_name');
            toRecsBtn.addEventListener('click', function (e) {
                e.preventDefault();
                const teamName = teamSelect.value;
                if (!teamName) {
                    alert('Please select a team first.');
                    return;
                }
                window.location.href = "/recommendations/" + encodeURIComponent(teamName);
            });
        });
    </script>
</body>
</html>
