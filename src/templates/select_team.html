<!-- templates/select_team.html -->
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>Select Team | ScoutPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #e9f1fc 0%, #f7fafc 100%); }
        .card { border-radius: 22px; box-shadow: 0 8px 32px #0002; }
    </style>
</head>
<body>
<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card p-5" style="min-width:340px; max-width:420px;">
        <h2 class="mb-4 text-center text-primary">Select Your Team</h2>
        {% if error %}
            <div class="alert alert-danger text-center">{{ error }}</div>
        {% endif %}
        <form method="post" id="teamForm">
            <div class="mb-3">
                <label for="team_name" class="form-label fw-bold">Team</label>
                <select name="team_name" id="team_name" class="form-select" required>
                    <option value="" disabled selected>Select...</option>
                    {% for team in teams %}
                        <option value="{{ team }}">{{ team }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="d-grid gap-3 mt-4">
                <button type="submit" name="action" value="filters" class="btn btn-primary btn-lg" id="toFiltersBtn">Player Search (Filters)</button>
                <button type="submit" name="action" value="recs" class="btn btn-success btn-lg" id="toRecsBtn">Smart Recommendations</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
